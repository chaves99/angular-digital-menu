<!-- <button [routerLink]="['..']" [fragment]="productId.toString()" class="btn btn-primary">get back</button> -->

@if(state !== null) {
<div class="container py-3">
  <small class="text-body-secondary text-capitalize">{{ state.categoryName }}</small>
  <h1 class="display-3 fw-semibold">{{ state.product.name }}</h1>
  <p class="" style="white-space: pre-line; "> {{ state.product.description }}</p>
  <div class="mt-5">
    @for(price of state.product.prices; track price.id) {
    <p class="">
      @if (price.unit !== null && price.unit.length > 0) {
      {{ price.unit }} -
      }
      {{ price.value | currency: 'BRL'}}
    </p>
    }
  </div>
  <div class="d-grid mt-4">
    <button class="btn btn-secondary" (click)="back()">
      Voltar
    </button>
  </div>
</div>
}
