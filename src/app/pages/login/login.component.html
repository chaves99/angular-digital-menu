<form class="container" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
  <div class="row">
    <div class="d-flex justify-content-center my-5">
      @if(isDark()) {
        <img src="logo/logo_white_2.png" class=" " width="120" height="96" alt="logo">
      } @else {
        <img src="logo/logo_black_2.png" class=" " width="120" height="96" alt="logo">
      }
    </div>
    <div class="col-lg-8 offset-lg-2 col-xl-6 offset-xl-3">
      <div class="mt-2 p-3 border rounded">
        <h3 class="mb-3 text-center fs-3">Acessar</h3>
        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input [ngClass]="invalidEmail ? 'is-invalid' : ''"
            type="email" class="form-control" id="email" formControlName="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha:</label>
          <input type="password" class="form-control" id="password" formControlName="password" required>
        </div>
        @if(showError) {
        <div #formAlert class="alert alert-dismissible alert-danger mt-1" role="alert">
          <p>Email ou senha incorretos!</p>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        }
        <div class="d-flex mt-2 row px-3">
          <button class="col-md-2 offset-md-10 mt-3 btn btn-primary" [ngClass]="isLoading ? 'disabled' : ''" type="submit">
              @if (isLoading) {
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
              } @else {
                Entrar
              }
          </button>
        </div>
      </div>
      <div class="d-flex justify-content-between mt-3">
        <button [routerLink]="['..', 'password-recovery']" type="button" class="btn btn-link">Esqueceu a senha?</button>
          <button class="btn btn-outline-primary" type="button" routerLink="register">
              Criar conta
          </button>
      </div>
    </div>
  </div>
</form>
