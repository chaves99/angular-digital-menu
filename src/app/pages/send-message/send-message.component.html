<div class="pb-5">
  <div [ngClass]="themeSignal() === 'dark' ? 'bg-dark-subtle' : 'bg-light'"
    class="mx-auto py-4 px-3 px-md-5 rounded-3 border shadow mt-5" style="max-width: 600px;">
    <h2 class=" mb-3">Fale com a gente. <i class="bi bi-send-check"></i></h2>
    <p>Responderemos o mais breve possivel.</p>
    <p>Campos obrigatórios(*)</p>
    <div class="mb-3">
      <label for="email" class="form-label">E-mail:*</label>
      <input [formField]="form.email" type="email" class="form-control" id="email" placeholder="name@example.com">
    </div>
    <!-- } -->
    <div class="mb-3">
      <label for="subject" class="form-label">Assunto:</label>
      <input [formField]="form.subject" type="subject" class="form-control" id="subject" placeholder="">
    </div>
    <div class="mb-3">
      <label for="exampleFormControlTextarea1" class="form-label">Mensagem:*</label>
      <textarea [formField]="form.message" class="form-control" id="exampleFormControlTextarea1" rows="8"></textarea>
    </div>
    <div class="d-flex justify-content-end">
      <button (click)="onSend()" type="button" class="btn btn-primary">
        <i class="bi bi-send"></i>
        Enviar
        @if (isLoading) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        }
      </button>
    </div>
  </div>
</div>
