@if (!isLoading) {
<div class="mt-5 row">
  <div class="col-xl-8 offset-xl-2">
    <form class="card" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="card-header">
        <h4>Atualizar senha</h4>
      </div>
      <div class="card-body">
        <div class="row pb-3 gy-3">
          <div class="col-12">
            <label for="currentPassword" class="form-label">Senha atual:</label>
            <input [ngClass]="isInvalidPassword ? 'is-invalid' : ''"
              type="password"
              class="form-control" id="currentPassword"
              placeholder="" formControlName="currentPassword" required>
          </div>
          <div class="col-12">
            <label for="newPassword" class="form-label">Senha nova:</label>
            <input type="password" class="form-control" id="newPassword" placeholder="" formControlName="newPassword" required>
          </div>
          <div class="col-12">
            <label for="confirmNewPassword" class="form-label">Confirmar senha nova:</label>
            <input type="password" class="form-control" id="confirmNewPassword" placeholder="" formControlName="confirmNewPassword"
              required>
            <div id="validationServerUsernameFeedback" class="invalid-feedback">
              Please choose a username.
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-3 gap-3">
          <button type="button" (click)="onBack()" class="btn btn-secondary">
            Voltar
          </button>
          <button type="submit" class="btn btn-primary">
            Atualizar
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
} @else {
<app-spinner></app-spinner>
}
