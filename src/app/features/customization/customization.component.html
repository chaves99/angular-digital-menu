<div class="container-fluid py-5">
  <div class="btn-toolbar gap-3" role="">
    <div class="btn-group" role="group">
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#font-modal">
        <i class="bi bi-fonts"></i>
      </button>
      <button type="button" class="btn btn-primary" (click)="onOpenColorModal()">
        <i class="bi bi-palette"></i>
      </button>
    </div>
    <div class="btn-group">
      <button type="button" class="btn btn-primary" (click)="onOpenThemesModal()">
        Temas Prontos
      </button>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" type="button" (click)="onSave()">
        Salvar
        @if(isSaving) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        } @else {
          <i class="bi bi-floppy"></i>
        }
      </button>
      <button class="btn btn-primary" type="button" (click)="onApplyingActive()">
        Usar tema
        @if(isApplyingActive) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        }
      </button>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="overflow-auto mx-auto px-0 border-4 border bg-light rounded-4 mt-5 col-auto"
      style="height: 650px; scrollbar-width: none; width: 440px">
      <app-customer-menu class="w-100" [themeInput]="selectedTheme()" [urlCustomer]="user!.establishmentUrl">
      </app-customer-menu>
    </div>
  </div>
</div>

<!-- ########## FONT MODAL ########## -->
<div id='font-modal' class="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-md-down">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Escolha sua fonte</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        @for(type of fonts; track $index) {
        <p class="">{{ type.type }}:</p>
        <div class="list-group mb-4">
          @for(font of type.fonts; track $index) {
          <button (click)="onSelectFont(font)" data-bs-dismiss="modal" type="button"
            style="font-family: {{ font }}; font-size: 22px" class="list-group-item list-group-item-action">
            {{ font }}
          </button>
          }
        </div>
        }
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>
</div>
