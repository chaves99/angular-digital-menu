@if(isLoading) {
<app-spinner></app-spinner>
} @else {
<div class="mt-0">
  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseWidthExample" aria-expanded="false" aria-controls="collapseWidthExample">
      <i class="bi bi-info-square"></i>
    </button>
  </div>
  <div class="d-flex justify-content-end mb-3">
    <div class="collapse" id="collapseWidthExample">
      <div class="card card-body" style="width: 300px;">
        Escolha uma imagem do seu estabelecimento para aparecer no início do menu.
      </div>
    </div>
  </div>

  <div class="card">
    <h4 class="card-header">
      Banner
    </h4>
    <div class="card-body">
      <div class="row">
        <div class="col-auto">
          <label for="formFileLg" class="form-label">Escolher imagem</label>
          <input (change)="onImageChange($event)" class="form-control form-control-lg" id="formFileLg" type="file">
        </div>
      </div>
    </div>
    <div class="card-body text-end">
      <button type="button" (click)="onSubmit()" class="btn btn-primary">Salvar</button>
    </div>
  </div>
  @if (hasImage()) {
  <img [src]="user!.image + getLastModified()" class="mt-3 img-fluid"/>
  }
</div>
}
