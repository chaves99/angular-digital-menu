@if(isLoading) {
<app-spinner></app-spinner>
} @else {
<div class="mt-0">
  <form class="card" [formGroup]="addressFormGroup" (ngSubmit)="onSubmit()">
    <h4 class="card-header">
      Endereço
    </h4>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <label for="code" class="form-label">CEP:</label>
          <input class="form-control" id="code" formControlName="code">
        </div>
        <div class="col-md-6 mt-md-0 mt-3">
          <label for="city" class="form-label">Cidade:</label>
          <input class="form-control" id="city" formControlName="city">
        </div>
        <div class="col my-3">
          <label for="line" class="form-label">Endereço:</label>
          <input class="form-control" id="line" formControlName="line">
        </div>
      </div>
    </div>
    <div class="card-body text-end">
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</div>
}
