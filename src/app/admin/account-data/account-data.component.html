@if (user !== null) {
<div class="container mt-5">
  <dl class="row">
    <dt class="col-sm-3 mb-2">E-mail: </dt>
    <dd class="col-sm-9 mb-3">
      <div class="mb-3">
        <input type="email" class="form-control" disabled [value]="user.email">
      </div>
    </dd>

    <dt class="col-sm-3 mb-2">Nome do estabelecimento: </dt>
    <dd class="col-sm-9 mb-3">
      <div class="mb-3">
        <input type="email" class="form-control" disabled [value]="user.establishmentName">
      </div>
    </dd>

    <dt class="col-sm-3 mb-2">Descrição do estabelecimento: </dt>
    <dd class="col-sm-9 mb-3">
      <div class="mb-3">
        <textarea [(ngModel)]="newDescription" type="email" class="form-control"></textarea>
        @if (hasDescriptionChange()) {
          <div class="d-flex justify-content-end">
            <button (click)="onUpdateDescription()" class="mt-2 btn btn-success" type="button" id="button-addon2">
              Salvar
              @if (isLoadingDescCall) {
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
              }
            </button>
          </div>
        }
      </div>
    </dd>

    <dt class="col-sm-3 mb-2">URL do menu: </dt>
    <dd class="col-sm-9 mb-3">
      <div class="input-group mb-3">
        <input type="email" class="form-control" disabled [value]="getUrl()">
        <a [href]="getUrl()" target="_blank" class="btn btn-primary" type="button" id="button-addon2">
          Acessar
        </a>
        <button (click)="onCopyUrl()" class="btn btn-success" type="button" id="button-addon2">
          Copiar
        </button>
      </div>
    </dd>

    <dt class="col-sm-3 mb-2">Assinatura: </dt>
    <dd class="col-sm-9 mb-4">
      <div class="d-block">
        <p> {{ user.subscription }} </p>
        <a routerLink="../subscription" class="btn btn-primary shadow-sm">
          Ir para Assinatura
        </a>
      </div>
    </dd>

    <dt class="col-sm-3">Data de criação: </dt>
    <dd class="col-sm-9 mb-4">
      <p> {{ user.createdAt | date: 'd/MM/yy, H:mm' }}. </p>
    </dd>

    <div class="col-12 mb-4 d-flex justify-content-center">
      <a routerLink="../update-password" class="mx-auto btn btn-warning">
        Atualizar Senha
      </a>
    </div>

  </dl>
</div>
}
